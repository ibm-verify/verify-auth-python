# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: openapi/openapi-processed.json
      overlays: overlays.yml
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        output:
          location: local-file-system
          path: ../sdks/typescript
        version: 3.70.7
  python-sdk:
    generators:
      - name: fern-python-sdk
        version: latest
        output:
          location: local-file-system
          path: ../src/ibm_verify
        config:
          package_name: ibm_verify
          client_class_name: VerifyClient
          import_paths:
            - client_extension

      
